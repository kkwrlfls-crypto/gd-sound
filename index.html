<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Sound 장비 관리 시스템</title>
  <!-- Tailwind CSS & QR Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    #reader video { object-fit: cover; width: 100% !important; border-radius: 0.75rem; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">
  <div class="max-w-2xl mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- 상단 헤더 -->
    <header class="flex justify-between items-center bg-slate-800/80 backdrop-blur p-4 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">GD Sound System</h1>
        <p class="text-xs text-slate-400 mt-0.5">장비 관리 시스템</p>
      </div>
      <button onclick="openScanner()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold px-4 py-2 rounded-xl text-sm shadow-lg shadow-emerald-900/30 flex items-center gap-2 transition-all active:scale-95">
        <span>📷</span> QR 스캔
      </button>
    </header>

    <!-- 메인 탭 메뉴 -->
    <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 text-sm font-medium">
      <button id="tabBtn1" onclick="switchTab('inventory')" class="flex-1 py-2 rounded-lg bg-blue-600 text-white transition">장비 목록</button>
      <button id="tabBtn2" onclick="switchTab('checkout')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition">🚛 출고 / 반납 현황</button>
    </div>

    <!-- TAB 1: 전체 장비 목록 & 등록 -->
    <div id="tabInventory" class="space-y-6">
      <!-- 장비 등록 폼 -->
      <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-4">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-400"></span> 장비 등록
        </h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- 대분류 선택 -->
          <select id="mainCategory" onchange="updateSubCategory()" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
            <option value="콘솔">카테고리(대): 🎛️ 콘솔</option>
            <option value="스피커">카테고리(대): 🔊 스피커</option>
            <option value="마이크">카테고리(대): 🎙 마이크</option>
            <option value="케이블" selected>카테고리(대): 🔌 케이블</option>
            <option value="이어폰/헤드폰">카테고리(대): 🎧 이어폰/헤드폰</option>
            <option value="스탠드">카테고리(대): 📐 스탠드</option>
            <option value="기타">카테고리(대): 📦 기타</option>
          </select>

          <!-- 소분류 선택 -->
          <select id="subCategory" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
          </select>

          <input id="eqName" type="text" placeholder="장비/케이블명 (예: Canary XLR 5M)" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
          <input id="eqCode" type="text" placeholder="관리번호 (예: CBL-XLR-001)" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
          
          <!-- 보관 장소 -->
          <select id="eqLocation" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
            <option value="방송실">보관장소: 방송실</option>
            <option value="3층 대성전">보관장소: 3층 대성전</option>
            <option value="2층 소성전">보관장소: 2층 소성전</option>
            <option value="4층 창고">보관장소: 4층 창고</option>
            <option value="길동 작업실">보관장소: 길동 작업실</option>
          </select>

          <select id="eqStatus" class="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
            <option value="정상">상태: 정상</option>
            <option value="수리필요">상태: 수리필요</option>
            <option value="점검중">상태: 점검중</option>
            <option value="폐기">상태: 폐기</option>
          </select>

          <!-- 수량 입력 -->
          <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-1.5">
            <span class="text-xs text-slate-400">등록 수량:</span>
            <input id="eqQty" type="number" value="1" min="1" class="w-full bg-transparent text-sm text-slate-200 focus:outline-none font-bold">
          </div>

          <!-- 사진 업로드 -->
          <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-1.5">
            <span class="text-xs text-slate-400">사진:</span>
            <input id="eqImage" type="file" accept="image/*" onchange="handleImageUpload(event)" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:bg-slate-700 file:text-slate-200">
          </div>
        </div>

        <button onclick="addEquipment()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-blue-900/30 active:scale-98">
          장비 등록 / 수량 누적 저장
        </button>
      </section>

      <!-- 검색 및 장비 목록 -->
      <section class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-sm font-medium text-slate-400">등록된 전체 장비</h3>
          <div class="flex gap-2">
            <input id="searchInput" oninput="renderList()" type="text" placeholder="검색..." class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-xs text-slate-200 focus:outline-none focus:border-blue-500 w-32">
            <button onclick="exportToExcel()" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs px-2.5 py-1 rounded-lg font-medium transition">
              📊 엑셀 내보내기
            </button>
          </div>
        </div>
        <div id="equipmentList" class="space-y-3"></div>
      </section>
    </div>

    <!-- TAB 2: 출고 / 반납 현황 관리 -->
    <div id="tabCheckout" class="space-y-6 hidden">
      <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-4">
        <h2 class="text-sm font-semibold text-amber-400 flex items-center gap-2">
          <span>📋</span> 행사 및 출고 정보 설정
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">행사명 / 사용 목적</label>
            <input id="eventName" type="text" placeholder="예: 주일 3부 예배 / 야외 수련회" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">출고 날짜</label>
            <input id="eventDate" type="date" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
          </div>
        </div>
        <p class="text-xs text-slate-400">💡 상단 <span class="text-emerald-400 font-semibold">[📷 QR 스캔]</span> 버튼을 눌러 스캔한 장비들이 아래 출고 목록에 자동으로 들어옵니다.</p>
      </section>

      <!-- 현재 출고 처리 중인 리스트 -->
      <section class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-sm font-medium text-amber-400">현재 출고 목록 (<span id="checkoutCount">0</span>개)</h3>
          <button onclick="exportCheckoutToExcel()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-1 rounded-lg font-medium transition">
            📄 출고 명세서 엑셀 다운로드
          </button>
        </div>
        <div id="checkoutList" class="space-y-3"></div>
      </section>
    </div>

  </div>

  <!-- Modal: QR View -->
  <div id="qrModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl">
      <h3 id="qrModalTitle" class="font-bold text-lg text-slate-100"></h3>
      
      <!-- 인쇄 크기 선택 옵션 -->
      <div class="flex justify-center items-center gap-2 text-xs text-slate-300">
        <span>출력 크기:</span>
        <select id="qrSizeSelect" onchange="updateQRSize()" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-slate-200">
          <option value="75">소형 (2cm x 2cm - 케이블/소형)</option>
          <option value="130" selected>중형 (3.5cm x 3.5cm - 표준)</option>
          <option value="190">대형 (5cm x 5cm - 장비/랙케이스)</option>
        </select>
      </div>

      <div id="printArea" class="p-3 bg-white rounded-xl inline-block shadow-inner mx-auto">
        <div id="qrcode" class="flex justify-center"></div>
      </div>
      
      <div id="qrPhotoContainer" class="hidden">
        <img id="qrModalPhoto" class="w-full h-32 object-cover rounded-xl border border-slate-700" src="" alt="장비 사진">
      </div>

      <p id="qrModalCode" class="text-xs font-mono text-slate-400"></p>
      
      <div class="flex gap-2">
        <button onclick="window.print()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-xl text-xs font-medium transition">인쇄하기</button>
        <button onclick="closeQRModal()" class="flex-1 bg-slate-900 hover:bg-slate-950 text-slate-400 py-2 rounded-xl text-xs font-medium transition">닫기</button>
      </div>
    </div>
  </div>

  <!-- Modal: Scanner -->
  <div id="scannerModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 w-full max-w-sm text-center space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-slate-200 text-sm">QR 스캔 (출고/조회)</h3>
        <button onclick="closeScanner()" class="text-slate-500 hover:text-slate-300 font-bold px-2 text-xl">&times;</button>
      </div>
      <div id="reader" class="w-full bg-slate-950 rounded-xl overflow-hidden min-h-[250px] border border-slate-800"></div>
      <p class="text-xs text-slate-500">스캔 시 해당 장비가 '출고 목록'으로 자동 이동합니다.</p>
    </div>
  </div>

  <script>
    // 1. Firebase 초기화 설정
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 소분류 옵션 데이터
    const categoryOptions = {
      "콘솔": ["디지털 믹서", "아날로그 믹서", "오디오 인터페이스", "스테이지 박스", "기타 콘솔"],
      "스피커": ["메인 스피커", "모니터 스피커", "서브우퍼", "파워 앰프", "기타 스피커"],
      "마이크": ["유선 다이나믹", "유선 콘덴서", "무선 마이크(핸드)", "무선 마이크(벨트팩)", "핀/헤드셋 마이크"],
      "케이블": ["마이크 케이블(XLR)", "스피커 케이블(Speakon)", "악기 케이블(TS/TRS)", "멀티 케이블", "전원 케이블", "변환 젠더/기타"],
      "이어폰/헤드폰": ["인이어 이어폰", "모니터링 헤드폰", "무선 수신기 팩"],
      "스탠드": ["마이크 스탠드(T자)", "마이크 스탠드(일자)", "스피커 스탠드", "악기/악보대 스탠드"],
      "기타": ["악세사리", "전원 공급장치", "기타 장비"]
    };

    let db = null;
    let isFirebaseReady = false;
    
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      isFirebaseReady = true;
    }

    let equipmentData = [];
    let html5QrcodeScanner = null;
    let currentBase64Image = '';
    let currentQRData = { name: '', code: '' };

    document.getElementById('eventDate').valueAsDate = new Date();

    function updateSubCategory() {
      const mainCat = document.getElementById('mainCategory').value;
      const subSelect = document.getElementById('subCategory');
      subSelect.innerHTML = '';

      const subs = categoryOptions[mainCat] || ["기타"];
      subs.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.innerText = `소분류: ${sub}`;
        subSelect.appendChild(opt);
      });
    }

    function loadData() {
      if (isFirebaseReady) {
        db.collection("equipments").onSnapshot((snapshot) => {
          equipmentData = [];
          snapshot.forEach((doc) => {
            equipmentData.push({ id: doc.id, ...doc.data() });
          });
          renderList();
          renderCheckoutList();
        });
      } else {
        equipmentData = JSON.parse(localStorage.getItem('gd_sound_db_v4') || '[]');
        renderList();
        renderCheckoutList();
      }
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = () => {
        currentBase64Image = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function switchTab(tab) {
      if (tab === 'inventory') {
        document.getElementById('tabInventory').classList.remove('hidden');
        document.getElementById('tabCheckout').classList.add('hidden');
        document.getElementById('tabBtn1').className = "flex-1 py-2 rounded-lg bg-blue-600 text-white transition";
        document.getElementById('tabBtn2').className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition";
      } else {
        document.getElementById('tabInventory').classList.add('hidden');
        document.getElementById('tabCheckout').classList.remove('hidden');
        document.getElementById('tabBtn1').className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition";
        document.getElementById('tabBtn2').className = "flex-1 py-2 rounded-lg bg-amber-600 text-white transition";
      }
    }

    function addEquipment() {
      const mainCat = document.getElementById('mainCategory').value;
      const subCat = document.getElementById('subCategory').value;
      const name = document.getElementById('eqName').value.trim();
      const code = document.getElementById('eqCode').value.trim();
      const location = document.getElementById('eqLocation').value;
      const status = document.getElementById('eqStatus').value;
      const qty = parseInt(document.getElementById('eqQty').value) || 1;

      if (!name || !code) return alert('장비 이름과 관리번호는 필수입니다.');

      const existingIndex = equipmentData.findIndex(e => e.code === code || e.name === name);

      if (existingIndex > -1) {
        const existingItem = equipmentData[existingIndex];
        const newQty = (existingItem.quantity || 1) + qty;

        if (isFirebaseReady) {
          db.collection("equipments").doc(existingItem.code).update({
            quantity: newQty,
            mainCategory: mainCat,
            subCategory: subCat,
            location: location,
            status: status,
            image: currentBase64Image || existingItem.image || ''
          });
        } else {
          existingItem.quantity = newQty;
          existingItem.mainCategory = mainCat;
          existingItem.subCategory = subCat;
          existingItem.location = location;
          existingItem.status = status;
          if (currentBase64Image) existingItem.image = currentBase64Image;
          localStorage.setItem('gd_sound_db_v4', JSON.stringify(equipmentData));
          renderList();
        }
        alert(`[${existingItem.name}] 수량이 +${qty}개 누적되었습니다. (총 ${newQty}개)`);
      } else {
        const newItem = {
          name,
          code,
          mainCategory: mainCat,
          subCategory: subCat,
          location,
          status,
          quantity: qty,
          image: currentBase64Image,
          isCheckedOut: false,
          eventName: '',
          checkoutDate: ''
        };

        if (isFirebaseReady) {
          db.collection("equipments").doc(code).set(newItem);
        } else {
          equipmentData.unshift(newItem);
          localStorage.setItem('gd_sound_db_v4', JSON.stringify(equipmentData));
          renderList();
        }
      }

      document.getElementById('eqName').value = '';
      document.getElementById('eqCode').value = '';
      document.getElementById('eqQty').value = '1';
      document.getElementById('eqImage').value = '';
      currentBase64Image = '';
    }

    function renderList() {
      const container = document.getElementById('equipmentList');
      const keyword = document.getElementById('searchInput')?.value.toLowerCase() || '';
      container.innerHTML = '';

      const filtered = equipmentData.filter(eq => 
        eq.name.toLowerCase().includes(keyword) || 
        eq.code.toLowerCase().includes(keyword) ||
        (eq.mainCategory && eq.mainCategory.toLowerCase().includes(keyword)) ||
        (eq.subCategory && eq.subCategory.toLowerCase().includes(keyword)) ||
        (eq.location && eq.location.toLowerCase().includes(keyword))
      );

      filtered.forEach((eq) => {
        const badgeColor = eq.isCheckedOut ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' :
                           eq.status === '정상' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20';

        const categoryIcons = {
          "콘솔": "🎛️️", "스피커": "🔊", "마이크": "🎙", "케이블": "🔌",
          "이어폰/헤드폰": "🎧", "스탠드": "📐", "기타": "📦"
        };
        const icon = categoryIcons[eq.mainCategory] || "📦";

        const card = document.createElement('div');
        card.className = 'bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl shadow flex justify-between items-center';
        card.innerHTML = `
          <div class="flex items-center gap-3">
            ${eq.image ? `<img src="${eq.image}" class="w-12 h-12 rounded-lg object-cover border border-slate-700">` : `<div class="w-12 h-12 bg-slate-900 rounded-lg flex items-center justify-center text-xs text-slate-600">${icon}</div>`}
            <div class="space-y-0.5">
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-200 text-sm">${eq.name}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded-full border border-blue-500/30 bg-blue-500/10 text-blue-400 font-semibold">${eq.quantity || 1}개</span>
                <span class="text-[10px] px-2 py-0.5 rounded-full border ${badgeColor}">${eq.isCheckedOut ? '출고중' : eq.status}</span>
              </div>
              <div class="text-xs font-mono text-slate-400">${eq.code}</div>
              <div class="text-xs text-slate-400 flex items-center gap-1">
                <span class="bg-slate-700/60 px-1.5 py-0.2 rounded text-[11px] text-slate-300">${icon} ${eq.mainCategory || '케이블'} / ${eq.subCategory || 'XLR'}</span>
                <span>• 📍 ${eq.location || '방송실'}</span>
              </div>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="showQR('${eq.name}', '${eq.code}', '${eq.image || ''}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-600">
              QR
            </button>
            <button onclick="toggleCheckout('${eq.code}')" class="text-xs px-3 py-2 rounded-lg font-medium border ${eq.isCheckedOut ? 'bg-amber-900/40 text-amber-300 border-amber-700' : 'bg-slate-800 text-slate-400 border-slate-700'}">
              ${eq.isCheckedOut ? '반납' : '출고'}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderCheckoutList() {
      const container = document.getElementById('checkoutList');
      container.innerHTML = '';
      const checkedOutItems = equipmentData.filter(e => e.isCheckedOut);
      document.getElementById('checkoutCount').innerText = checkedOutItems.length;

      if (checkedOutItems.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">현재 출고된 장비가 없습니다.</div>`;
        return;
      }

      checkedOutItems.forEach(eq => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-amber-500/30 p-4 rounded-xl flex justify-between items-center';
        card.innerHTML = `
          <div>
            <div class="font-bold text-slate-100 text-sm">${eq.name} <span class="text-xs text-blue-400">(${eq.quantity || 1}개)</span></div>
            <div class="text-xs text-slate-400 mt-1">🗓️ 행사: ${eq.eventName || '미지정'} | 날짜: ${eq.checkoutDate || '미지정'}</div>
            <div class="text-xs text-slate-500">🏷️ 분류: ${eq.mainCategory || ''} - ${eq.subCategory || ''} | 📍 보관지: ${eq.location}</div>
          </div>
          <button onclick="toggleCheckout('${eq.code}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow">
            반납하기
          </button>
        `;
        container.appendChild(card);
      });
    }

    function toggleCheckout(code) {
      const item = equipmentData.find(e => e.code === code);
      if (!item) return;

      const eventName = document.getElementById('eventName').value || '기본 행사';
      const eventDate = document.getElementById('eventDate').value || new Date().toISOString().split('T')[0];

      const newStatus = !item.isCheckedOut;
      const updateData = {
        isCheckedOut: newStatus,
        eventName: newStatus ? eventName : '',
        checkoutDate: newStatus ? eventDate : ''
      };

      if (isFirebaseReady) {
        db.collection("equipments").doc(code).update(updateData);
      } else {
        Object.assign(item, updateData);
        localStorage.setItem('gd_sound_db_v4', JSON.stringify(equipmentData));
        renderList();
        renderCheckoutList();
      }
    }

    function openScanner() {
      document.getElementById('scannerModal').classList.remove('hidden');
      if (!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("reader");

      const config = { fps: 15, qrbox: { width: 220, height: 220 }, videoConstraints: { facingMode: "environment", focusMode: "continuous" } };

      html5QrcodeScanner.start({ facingMode: "environment" }, config, (decodedText) => {
        const item = equipmentData.find(e => e.code === decodedText);
        if (item) {
          toggleCheckout(item.code);
          alert(`[${item.name}] 장비가 ${item.isCheckedOut ? '반납' : '출고'} 처리되었습니다!`);
        } else {
          alert(`등록되지 않은 관리번호입니다: ${decodedText}`);
        }
        closeScanner();
      }, () => {}).catch(() => closeScanner());
    }

    function closeScanner() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => document.getElementById('scannerModal').classList.add('hidden'));
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
    }

    function showQR(name, code, image) {
      currentQRData = { name, code };
      document.getElementById('qrModalTitle').innerText = name;
      document.getElementById('qrModalCode').innerText = code;
      
      const photoContainer = document.getElementById('qrPhotoContainer');
      const photoImg = document.getElementById('qrModalPhoto');
      if (image) {
        photoImg.src = image;
        photoContainer.classList.remove('hidden');
      } else {
        photoContainer.classList.add('hidden');
      }

      updateQRSize();
      document.getElementById('qrModal').classList.remove('hidden');
    }

    function updateQRSize() {
      const size = parseInt(document.getElementById('qrSizeSelect').value) || 130;
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: currentQRData.code, width: size, height: size, correctLevel: QRCode.CorrectLevel.L });
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    function exportToExcel() {
      let csv = "\uFEFF대분류,소분류,장비명,수량,관리번호,보관위치,상태,출고여부,행사명,출고일자\n";
      equipmentData.forEach(e => {
        csv += `"${e.mainCategory || '기타'}","${e.subCategory || '기타'}","${e.name}","${e.quantity || 1}","${e.code}","${e.location || '방송실'}","${e.status}","${e.isCheckedOut ? '출고중' : '보관중'}","${e.eventName || ''}","${e.checkoutDate || ''}"\n`;
      });
      downloadCSV(csv, `GD_Sound_장비전체목록_${new Date().toISOString().split('T')[0]}.csv`);
    }

    function exportCheckoutToExcel() {
      const checkedOut = equipmentData.filter(e => e.isCheckedOut);
      if (checkedOut.length === 0) return alert('출고된 장비가 없습니다.');

      let csv = "\uFEFF행사명,출고일자,대분류,소분류,장비명,수량,관리번호,보관위치\n";
      checkedOut.forEach(e => {
        csv += `"${e.eventName}","${e.checkoutDate}","${e.mainCategory || '기타'}","${e.subCategory || '기타'}","${e.name}","${e.quantity || 1}","${e.code}","${e.location || '방송실'}"\n`;
      });
      downloadCSV(csv, `GD_Sound_출고명세서_${new Date().toISOString().split('T')[0]}.csv`);
    }

    function downloadCSV(csv, filename) {
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 초기 실행
    updateSubCategory();
    loadData();
  </script>
</body>
</html>
