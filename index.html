<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Sound 장비 관리</title>
  <!-- Tailwind CSS & QR Code / Scanner Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    #reader video { object-fit: cover; width: 100% !important; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div class="max-w-md mx-auto p-4">
    <!-- Header -->
    <header class="bg-slate-800 text-white p-4 rounded-xl shadow-lg mb-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">GD Sound 장비 관리</h1>
      <button onclick="openScanner()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-3 py-1.5 rounded-lg text-sm flex items-center gap-1 shadow">
        📷 QR 스캔
      </button>
    </header>

    <!-- Main Content / Equipment List -->
    <main class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow">
        <h2 class="text-lg font-semibold mb-2">장비 목록 및 QR 생성</h2>
        <div class="space-y-2 mb-4">
          <input id="eqName" type="text" placeholder="장비/케이블 이름 (예: XLR 3M)" class="w-full p-2 border rounded-lg text-sm">
          <input id="eqCode" type="text" placeholder="관리번호 (예: CBL-XLR-3M-001)" class="w-full p-2 border rounded-lg text-sm">
          <button onclick="addEquipment()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium text-sm hover:bg-blue-700">
            장비 등록 & QR 생성
          </button>
        </div>
      </div>

      <!-- Equipment Table/Cards -->
      <div id="equipmentList" class="space-y-3">
        <!-- 등록된 장비들이 여기에 표시됩니다 -->
      </div>
    </main>

    <!-- Modal: QR View -->
    <div id="qrModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl">
        <h3 id="qrModalTitle" class="font-bold text-lg"></h3>
        <div id="qrcode" class="flex justify-center my-2"></div>
        <p id="qrModalCode" class="text-sm font-mono text-gray-500"></p>
        <div class="flex gap-2">
          <button onclick="printQR()" class="flex-1 bg-gray-800 text-white py-2 rounded-lg text-sm font-medium">인쇄</button>
          <button onclick="closeQRModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-medium">닫기</button>
        </div>
      </div>
    </div>

    <!-- Modal: Scanner -->
    <div id="scannerModal" class="fixed inset-0 bg-black/80 hidden flex flex-col items-center justify-center p-4 z-50">
      <div class="bg-white rounded-xl p-4 w-full max-w-sm text-center space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold text-gray-800">QR 코드 스캔</h3>
          <button onclick="closeScanner()" class="text-gray-500 font-bold px-2 text-xl">&times;</button>
        </div>
        <div id="reader" class="w-full bg-black rounded-lg overflow-hidden min-h-[250px]"></div>
        <p class="text-xs text-gray-500">작은 QR은 15~20cm 거리에서 카메라를 비춰주세요.</p>
      </div>
    </div>
  </div>

  <script>
    let html5QrcodeScanner = null;
    let equipmentData = JSON.parse(localStorage.getItem('gd_sound_eq') || '[]');

    function renderList() {
      const container = document.getElementById('equipmentList');
      container.innerHTML = '';
      equipmentData.forEach((eq, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl shadow flex justify-between items-center';
        card.innerHTML = `
          <div>
            <div class="font-bold text-gray-800">${eq.name}</div>
            <div class="text-xs font-mono text-gray-500">${eq.code}</div>
            <span class="inline-block mt-1 text-xs px-2 py-0.5 rounded-full ${eq.status === '정상' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${eq.status || '정상'}</span>
          </div>
          <button onclick="showQR('${eq.name}', '${eq.code}')" class="bg-slate-100 text-slate-700 text-xs px-3 py-2 rounded-lg font-medium border hover:bg-slate-200">
            QR 보기
          </button>
        `;
        container.appendChild(card);
      });
    }

    function addEquipment() {
      const name = document.getElementById('eqName').value.trim();
      const code = document.getElementById('eqCode').value.trim();
      if (!name || !code) return alert('이름과 관리번호를 모두 입력해주세요.');
      
      equipmentData.push({ name, code, status: '정상' });
      localStorage.setItem('gd_sound_eq', JSON.stringify(equipmentData));
      document.getElementById('eqName').value = '';
      document.getElementById('eqCode').value = '';
      renderList();
    }

    function showQR(name, code) {
      document.getElementById('qrModalTitle').innerText = name;
      document.getElementById('qrModalCode').innerText = code;
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      
      // QR 생성 설정: CorrectLevel.L (7% 복원율) -> 격자 패턴을 최소화하여 작은 크기에서도 자동 초점 인식률 극대화
      new QRCode(qrContainer, {
        text: code,
        width: 180,
        height: 180,
        correctLevel: QRCode.CorrectLevel.L
      });
      
      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    function openScanner() {
      document.getElementById('scannerModal').classList.remove('hidden');
      
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }

      // 스마트폰 고화질/연속 초점 최적화 설정
      const config = { 
        fps: 15, 
        qrbox: { width: 220, height: 220 },
        videoConstraints: {
          facingMode: "environment",
          focusMode: "continuous"
        }
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          alert('스캔 성공! 관리번호: ' + decodedText);
          closeScanner();
        },
        (errorMessage) => { /* 연속 스캔 실패 무시 */ }
      ).catch(err => {
        alert('카메라를 열 수 없습니다. 권한 설정을 확인해 주세요.');
        closeScanner();
      });
    }

    function closeScanner() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
    }

    function printQR() {
      window.print();
    }

    renderList();
  </script>
</body>
</html>
